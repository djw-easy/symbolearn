[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolearn"
version = "0.1.0"
description = "Symbolic discovery of explicit and auditable spectral models for land cover mapping"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Academic use only — see README for details" }
authors = [
    { name = "Junwu Dong", email = "djw@lreis.ac.cn" },
]
keywords = [
    "symbolic-regression",
    "genetic-programming",
    "hyperspectral",
    "land-cover-mapping",
    "spectral-index",
    "remote-sensing",
    "interpreter-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tqdm>=4.0",
    "numba>=0.58",
]

[project.urls]
Paper = "https://doi.org/10.1109/TGRS.2026.3731741"
Homepage = "https://github.com/djw-easy/symbolearn"
Source = "https://github.com/djw-easy/symbolearn"
Issues = "https://github.com/djw-easy/symbolearn/issues"
Changelog = "https://github.com/djw-easy/symbolearn/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["symbolearn", "symbolearn.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
required_plugins = []
filterwarnings = ["ignore::UserWarning"]
