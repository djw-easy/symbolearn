name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest tests/ -q

      - name: Smoke-test README Quick Start
        run: |
          python - <<'PY'
          import pandas as pd
          from sklearn.datasets import make_classification
          from sklearn.model_selection import train_test_split
          from symbolearn import SymbolicClassifier, SymbolicRegressor, SymbolicTransformer, __version__
          assert isinstance(__version__, str) and __version__, __version__

          # 1. Tabular classification Quick Start path.
          # Smoke contract: pipeline runs end-to-end and produces SOME
          # learning signal above random (1/n_classes); we do not assert
          # paper-level accuracy here. A larger niterations (>=100) is
          # needed for paper benchmarks -- see README and train_sc.py.
          from sklearn.datasets import make_classification
          from sklearn.model_selection import train_test_split
          X, y = make_classification(
              n_samples=500, n_features=10, n_classes=3, n_informative=8,
              class_sep=1.5, random_state=0,
          )
          X_train, X_test, y_train, y_test = train_test_split(
              X, y, test_size=0.3, random_state=0
          )
          clf = SymbolicClassifier(
              maxsize=10, niterations=5, populations=5,
              population_size=11, ncycles_per_iteration=10,
              n_jobs=2, random_state=0,
          )
          clf.fit(X_train, y_train)
          acc = clf.score(X_test, y_test)
          # Random baseline for a 3-class problem is 1/3; require slightly above.
          assert acc > 1.0 / 3.0, acc
          assert acc <= 1.0, acc

          # 2. Public-method contracts.
          hof = clf.get_hof()
          assert isinstance(hof, pd.DataFrame), type(hof)
          must_have = {"complexity", "error", "expression"}
          missing = must_have - set(hof.columns)
          assert not missing, f"missing HOOF columns: {missing} (have: {list(hof.columns)})"

          best = clf.get_best()
          assert isinstance(best, pd.Series), type(best)
          assert "expression" in best.index, list(best.index)
          expr_field = best["expression"]
          # Single-output regression returns a string; multi-output
          # classification returns an ExpressionSet (or list-like with
          # .expressions / __iter__).
          if isinstance(expr_field, str):
              assert expr_field, repr(expr_field)
          else:
              sub_exprs = list(getattr(expr_field, "expressions", expr_field))
              assert len(sub_exprs) > 0, repr(expr_field)

          # 3. Other estimators are importable and constructable.
          SymbolicRegressor(maxsize=5, niterations=1, populations=2,
                            population_size=5, ncycles_per_iteration=2,
                            n_jobs=2, random_state=0)
          SymbolicTransformer(maxsize=5, niterations=1, populations=2,
                              population_size=5, ncycles_per_iteration=2,
                              n_jobs=2, random_state=0)
          print("SMOKE_OK")
          PY
