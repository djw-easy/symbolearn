name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest tests/ -q

      - name: Smoke-test README Quick Start
        run: |
          python - <<'PY'
          from sklearn.datasets import make_classification
          from sklearn.model_selection import train_test_split
          from symbolearn import SymbolicClassifier
          X, y = make_classification(n_samples=200, n_features=10, random_state=0)
          X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=0)
          clf = SymbolicClassifier(
              maxsize=8, niterations=3, populations=3,
              population_size=9, ncycles_per_iteration=5,
              n_jobs=2, random_state=0,
          )
          clf.fit(X_train, y_train)
          assert 0.5 < clf.score(X_test, y_test) < 1.0, clf.score(X_test, y_test)
          assert isinstance(clf.get_best_individual() if hasattr(clf, "get_best_individual") else clf.get_best(), object)
          print("SMOKE_OK")
          PY
